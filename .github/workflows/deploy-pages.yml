name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; the deploy job is granted what Pages needs.
permissions:
  contents: read

# Let a running Pages deployment finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Repo is served from a project subpath: https://<owner>.github.io/inksana/
      BASE_PATH: /inksana/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # pinned to the v4 commit; keep in step with packageManager in package.json
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm exec turbo run build --filter=web

      - name: Add SPA fallback + disable Jekyll
        # Pages serves 404.html for unknown paths; the SPA shell lets vue-router
        # resolve deep links (e.g. /inksana/home) on refresh. .nojekyll keeps
        # underscore-prefixed asset chunks from being stripped.
        run: |
          cp apps/web/dist/index.html apps/web/dist/404.html
          touch apps/web/dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish to Pages
      id-token: write # OIDC token for deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
